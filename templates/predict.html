{% extends 'base.html' %} {% block content %}

<div class="predict-container">
  <div class="predict-card">
    <h2>Sentiment Prediction</h2>

    <p class="subtitle">
      Enter a sentence related to women's safety to analyze its sentiment.
    </p>

    <form method="POST">
      {% csrf_token %}

      <textarea
        name="text_input"
        placeholder="Example: I feel unsafe walking alone at night..."
        required
      ></textarea>

      <button type="submit">Analyze Sentiment</button>
    </form>

    {% if prediction %}
    <div class="result-box">
      <h3>Prediction Result</h3>
      <p class="result-text">{{ prediction }}</p>
    </div>
    {% endif %}
